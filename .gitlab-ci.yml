stages:
  - test
  - security
  - release

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'

test:
  stage: test
  image: node:22
  cache:
    - key:
        files:
          - package-lock.json
      paths:
        - node_modules/
  before_script:
    - npm ci
  script:
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'push'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

secret_detection:
  stage: security

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - |
      NOTES=$(awk -v h="## [$VERSION]" '
        index($0, h) == 1 { found = 1; next }
        found && (/^## \[/ || /^\[[0-9]/) { exit }
        found { print }
      ' CHANGELOG.md)
    - |
      if [ -z "$NOTES" ]; then
        echo "No CHANGELOG section for $VERSION" >&2
        exit 1
      fi
    - printf '%s\n' "$NOTES" | glab release create "$CI_COMMIT_TAG" --name "CatSuggest $VERSION" --notes-file -
